# SPDX-License-Identifier: GPL-3.0-or-later
#
# From linuxmusterDEV/templates/ci.yml. On every push/PR: the fast tier (lint/type/unit +
# shell + license compliance + lock gates + blocklist smoke), the package build with
# dpkg-buildpackage in the same container upstream CI uses (proves it builds on the target
# Ubuntu/Python; lintian on the .deb), the lock cases through that build, the file-tree gate
# against the newest release, an install smoke on ubuntu-24.04 and an upgrade smoke on top
# of the newest published release. The heavy Kerberos + docker-py E2E runs on crabbox, not
# in GitHub CI.
#
# Supply chain (stage A, work/plans/paketarchiv.md §2): every input of the build is pinned to
# an immutable reference, because a released .deb vouches for everything that ran in its build.
#  * Build image by digest. ghcr.io/linuxmuster/lmndev-runner:24.04 is a mutable tag of another
#    org, rebuilt every Monday, and runs as root; `:<tag>@sha256:<digest>` pulls exactly that
#    image (the digest wins, the tag only names the line whose digest is pinned).
#  * Every action by full commit SHA with a `# vN` comment: a tag can be moved, a SHA cannot.
#  * Keep ci.yml and release.yml on the SAME digests, or CI proves a different build than the
#    one that is released.
#  * Python dependencies from hash-pinned lock files (packaging/lock-deps.sh); pip never
#    resolves or downloads anything unpinned while the .deb is built.
# Pins and locks are raised by hand: the Renovate workflow is disabled (Kevin, 2026-09-25) until
# Renovate is re-enabled with a GitHub App (renovate.json and renovate.yml stay for that day).
# Nothing is automerged; raise a digest in ci.yml and release.yml in the same commit.
name: ci

on:
  # Only main and tags on push: every other branch is covered by its pull request,
  # so a PR branch does not run the whole pipeline twice per commit.
  push:
    branches: [main]
    tags: ['v[0-9]*']       # the sanity checks run for releases too (release.yml only gates/builds)
  pull_request:
  workflow_dispatch:
    inputs:
      prev_tag:
        description: 'upgrade smoke: tag to upgrade from (empty = newest published release)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"        # = Ubuntu 24.04 / lmn73
      # The gate tools are PINNED on purpose: an unpinned `pip install ruff` picks up
      # whatever released last, and a linter that widens its default rule set turns the
      # pipeline red without a single line of our code changing (ruff 0.16 did exactly
      # that here). Pinned == the developer's local result == CI's result. Bumps are PRs,
      # raised by hand while Renovate is off (see the header).
      #
      # The locked runtime dependencies are installed AFTER the tools, with their hashes:
      # the tests then run against exactly what the .deb ships (a lock PR is tested
      # against the versions it proposes), and `pip check` fails if a tool cannot
      # live with a locked version instead of the tool quietly moving it.
      - name: Install tools + locked dependencies + control-plane
        run: |
          pip install \
            ruff==0.15.21 \
            mypy==2.2.0 \
            reuse==6.2.0 \
            pytest==9.1.1 \
            pytest-asyncio types-PyYAML
          # uv (with setuptools) from the build lock, hash-checked: the lock gate below runs
          # with the same uv as the one in every package build (packaging/build-venv.sh).
          pip install --require-hashes --no-deps --only-binary :all: -r packaging/requirements-build.lock
          pip install --require-hashes --no-deps --only-binary :all: -r controlplane/requirements.lock
          pip install --no-deps ./controlplane
          pip check
      # The locks must still satisfy controlplane/pyproject.toml and the .in files, and
      # every hash in them must be one PyPI lists for that pin.
      - name: lock files match their inputs
        run: bash packaging/lock-deps.sh --check
      # The manipulations of the stage A cold verification stay rejected by --lint, --check and
      # --verify-freeze; the lock-gates-build job runs the same lock cases through make deb.
      - name: lock gates (regression)
        run: bash scripts/tests/lock_gates.sh
      - name: ruff check
        run: ruff check .
      # Formatting is a gate, not a suggestion: without it the tree drifts away from
      # `ruff format` (it had, in seven files) and every later PR carries unrelated
      # reformatting noise. Same pinned ruff as the lint step, so local == CI.
      - name: ruff format --check
        run: ruff format --check .
      # No .py extension, so `ruff check .` does not see it; byte-identical in squid, radius
      # and readonlydc (linuxmusterDEV work/plans/venv-debian-umbau/).
      - name: ruff (debian/venv-relocate)
        run: |
          ruff check --line-length 100 debian/venv-relocate
          ruff format --check --line-length 100 debian/venv-relocate
      - name: mypy
        run: mypy --config-file controlplane/pyproject.toml controlplane/lmnsquid
      - name: pytest
        run: pytest -q controlplane/tests
      - name: shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && shellcheck --severity=warning $(git ls-files '*.sh') debian/postinst debian/prerm debian/postrm
      - name: reuse (license compliance)
        run: reuse lint
      - name: blocklist smoke
        run: bash scripts/tests/blocklist_smoke.sh

  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: image
        run: |
          DIST=$(dpkg-parsechangelog -S Distribution); NUM="${DIST#lmn}"
          # Pinned by digest (see the header); raise both lines here and in release.yml together.
          IMG_LMN73=ghcr.io/linuxmuster/lmndev-runner:24.04@sha256:6b0c8ac994cf1d2da44b0b36ebd7b3b125094886e78293e04b9db5e515b8209e
          IMG_LMN74=ghcr.io/linuxmuster/lmndev-runner:latest@sha256:d735e6ccc6fd9df71b2552b06ac6f5cb4bf2d03f40e14bafe47213325b7b801b
          if [ "${NUM:-0}" -ge 74 ] 2>/dev/null; then IMG=$IMG_LMN74; else IMG=$IMG_LMN73; fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "version=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build package (make deb = dpkg-buildpackage; build deps via build-dep)
        run: |
          # Never `2>/dev/null || true`: a build dependency that cannot be installed must fail
          # here, where the reason is in the log.
          apt-get update -qq && apt-get build-dep -y -qq .
          make deb
          # dpkg-buildpackage writes one level above the source tree.
          mkdir -p output && mv ../*.deb ../*.changes ../*.buildinfo ../*.dsc ../*.tar.xz output/
          # DEBIAN/md5sums must cover every shipped regular file, or `dpkg --verify` is a no-op.
          deb=$(ls output/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb --ctrl-tarfile "$deb" | tar -tf - | grep -qx './md5sums'
          test "$(dpkg-deb -c "$deb" | grep -c '^-')" = "$(dpkg-deb --ctrl-tarfile "$deb" | tar -xOf - ./md5sums | wc -l)"
          echo "md5sums: $(dpkg-deb --ctrl-tarfile "$deb" | tar -xOf - ./md5sums | wc -l) files"
      - name: Lintian (the .deb only)
        run: |
          # Never lint the .changes: `lmn73` is not a known distribution, which makes lintian
          # fail with E: bad-distribution-in-changes-file on every single build. The venv's
          # expected tags are overridden, with reasons, in debian/linuxmuster-squid.lintian-overrides.
          lintian --fail-on error output/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: output/
          if-no-files-found: error

  # The lock gate is wired into the build (packaging/build-venv.sh): every manipulated lock of
  # scripts/tests/lock_gates.sh must stop `make deb` in that gate, before anything reaches the
  # shipped venv and without leaving a .deb.
  lock-gates-build:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every manipulated lock stops make deb in the lock gate
        run: |
          apt-get update -qq && apt-get build-dep -y -qq .
          LOCK_GATES_VERBOSE=1 bash scripts/tests/lock_gates.sh --build

  # The one failure mode of a packaging change that no other job would notice: a file quietly
  # falls out of the package or changes mode, because debhelper treats it differently from the
  # old hand-made staging tree (dh_fixperms would make the wheels' .so files 0644). It would
  # only show on a school server. So every build is compared, path by path, with the newest
  # published release: a path that disappears or changes mode/owner fails the build. Paths of
  # third-party distributions in the venv come and go with the lock; their completeness is
  # proven by debian/venv-relocate --verify (RECORD) and the freeze gate, so only those are
  # reported instead of failed. Permanent, not just for the debian/ conversion; the job is the
  # same in ci.yml and release.yml.
  file-tree:
    needs: package
    runs-on: ubuntu-latest        # GitHub-hosted: gh is installed here, not in the container
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Fetch the newest published release
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p previous
          # Prefer the newest real release, fall back to the newest prerelease. Skipping is
          # only legitimate when the repo has NO release at all: this gate stands between a
          # silently shrunk package and a school server.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                  --json tagName,isDraft,isPrerelease \
                  --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // ""')
            [ -n "$tag" ] && echo "::warning::no full release yet, comparing against prerelease $tag"
          fi
          if [ -z "$tag" ]; then
            if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq 'length')" != "0" ]; then
              echo "::error::releases exist but none could be selected - refusing to skip"; exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::first release of this package, nothing to compare against"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Compare the file tree with the released package
        if: steps.prev.outputs.skip != '1'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail          # without pipefail `tee` would swallow the exit code
          # mode owner path, sorted. Directories are compared too (an empty one would vanish
          # unnoticed in a file-only comparison); a symlink prints "path -> target", so a
          # retargeted link (/usr/bin/lmnsquid, the venv's python and lib64) is drift too.
          norm() { dpkg-deb -c "$1" | awk '{t = ($7 == "->" ? " " $7 " " $8 : ""); print $1, $2, $6 t}' | LC_ALL=C sort; }
          norm previous/*.deb > old.txt
          norm packages/*.deb > new.txt
          python3 - old.txt new.txt linuxmuster-squid lmnsquid "$PREV_TAG" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re
          import sys

          old_f, new_f, PKG, OWN = sys.argv[1:5]
          TAG = sys.argv[5] if len(sys.argv) > 5 else "previous release"
          SP = rf"opt/{PKG}/venv/lib/python3\.12/site-packages/"
          # 1. the own dist-info carries the version: compare it under a fixed name.
          DIST = re.compile(rf"^({SP}{OWN})-[^/]+\.dist-info")
          # 2. third-party distributions come and go with every lock bump; their completeness is
          #    proven by `debian/venv-relocate --verify` (RECORD) and the freeze == lock gate, so a
          #    path of theirs that disappears is reported, not failed. Mode/owner is checked everywhere.
          THIRD = re.compile(rf"^{SP}(?!{OWN}[/-])")
          # Paths that may legitimately disappear. Add an entry ONLY together with the changelog
          # sentence that explains it to admins.
          ALLOW_GONE = set()


          def read(name):
              rows = {}
              for line in open(name):
                  mode, owner, path = line.rstrip("\n").split(" ", 2)
                  if path == "./":  # the package root: dpkg never applies its mode
                      continue
                  rows[DIST.sub(r"\1-VERSION.dist-info", path.removeprefix("./"))] = (mode, owner)
              return rows


          old, new = read(old_f), read(new_f)
          gone = sorted(set(old) - set(new))
          added = sorted(set(new) - set(old))
          changed = sorted(p for p in set(old) & set(new) if old[p] != new[p])
          strict_gone = [p for p in gone if not THIRD.match(p) and p not in ALLOW_GONE]
          print(f"## File tree vs {TAG}\n")
          print(f"- released: {len(old)} entries, built: {len(new)} entries")
          print(f"- third-party venv paths: {sum(1 for p in gone if THIRD.match(p))} gone, "
                f"{sum(1 for p in added if THIRD.match(p))} added (lock changes, see RECORD check)")
          for p in added:
              if not THIRD.match(p):
                  print(f"- added: `{p}`")
          for p in strict_gone:
              print(f"::error::file lost from the package: {p}")
          for p in changed:
              print(f"::error::mode or owner changed: {p}: {old[p]} -> {new[p]}")
          if strict_gone or changed:
              sys.exit(1)
          print("\nfile tree: nothing lost, no mode or owner change")
          PY

  install-smoke:
    needs: package
    runs-on: ubuntu-24.04              # the target OS; the venv python must match
    steps:
      # the checkout is needed for scripts/tests/install_loop.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      # Actually install the built package and use it the way the docs tell an admin
      # to. Building alone proves nothing about the installed layout.
      - name: Install and use the package like an admin would
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y ./packages/*.deb
          test "$(command -v lmnsquid)" = /usr/bin/lmnsquid
          sudo lmnsquid --help >/dev/null
          # postinst enabled + started the service; the API must answer like the docs promise.
          ok=0
          for i in $(seq 1 30); do
            if sudo lmnsquid health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            systemctl status linuxmuster-squid.service --no-pager || true
            sudo journalctl -u linuxmuster-squid.service --no-pager | tail -50 || true
            exit 1
          fi
          sudo lmnsquid health
          # Single version source: the CLI/API report the .deb version (~rc -> rc in PEP 440).
          ver="$(dpkg-query -W -f='${Version}' linuxmuster-squid)"
          sudo lmnsquid version | grep -F "\"${ver//\~/}\""
          # every installed file matches the shipped md5sums (silent = ok)
          test -z "$(sudo dpkg --verify linuxmuster-squid)"
          test -x /usr/share/linuxmuster-squid/scripts/provision-keytab.sh

      # Regression guard for an intermittent configure failure: 7.3.1-7.3.3 committed to the
      # instance store as root and chowned the tree afterwards, racing the maintenance that
      # git >= 2.47 (the runner's git-core PPA git) detaches after a commit; the 7.3.3 release
      # run failed on it after earlier runs had passed. One install proves nothing about a
      # race, so the same .deb is configured 30 more times, failing on the first error.
      - name: Configure loop (15x purge + fresh install, 15x reinstall/dpkg-reconfigure)
        run: sudo bash scripts/tests/install_loop.sh packages/linuxmuster-squid_*_amd64.deb 15

  # Kevin's rule: a release must still install cleanly ON TOP OF the version that is
  # already running on a school server. This job installs the newest published release
  # (or the tag passed to workflow_dispatch), puts the config and state a real admin
  # has in place, upgrades to the freshly built package and checks that nothing was
  # lost. It skips itself only while no release exists at all.
  upgrade-smoke:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # restrictive org defaults: the job only reads our releases
    steps:
      # the checkout is needed for the fixtures below
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Fetch the published release to upgrade from
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, not interpolated into the script source.
          PREV_TAG: ${{ github.event.inputs.prev_tag }}
        run: |
          set -eu
          mkdir -p previous
          tag="${PREV_TAG:-}"
          if [ -z "$tag" ]; then
            # The version a school is running right now = the newest real release;
            # fall back to the newest prerelease if there is no full release yet.
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isDraft,isPrerelease \
                    --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
            if [ -z "$tag" ]; then
              tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                      --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // ""')
              [ -n "$tag" ] && echo "::warning::no full release yet, upgrading from prerelease $tag"
            fi
          fi
          if [ -z "$tag" ]; then
            # Skipping is only legitimate while the package has NO release at all: this
            # job gates the release job, so a silent skip would publish a tag whose
            # upgrade path was never tested.
            if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq 'length')" != "0" ]; then
              echo "::error::releases exist but none could be selected - refusing to skip"; exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::first release of this package, nothing to upgrade from"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::upgrading from $tag"

      - name: Install the released version and give it an admin's config and state
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y ./previous/*.deb
          # v1.3.0 (the pre-conventions line) ships no /usr/bin/lmnsquid, so the OLD
          # version is always driven through its venv entry point.
          LMN=/opt/linuxmuster-squid/venv/bin/lmnsquid
          for i in $(seq 1 30); do sudo "$LMN" health >/dev/null 2>&1 && break; sleep 1; done
          sudo "$LMN" health

          # The keytab is the domain credential. Its content is irrelevant here; that
          # its bytes and its 0600 survive the upgrade is the whole point.
          printf 'FAKE-KEYTAB-FOR-CI-UPGRADE-SMOKE\n' \
            | sudo tee /etc/linuxmuster-squid/secrets/proxy.keytab >/dev/null
          sudo chown lmnsquid:lmnsquid /etc/linuxmuster-squid/secrets/proxy.keytab
          sudo chmod 600 /etc/linuxmuster-squid/secrets/proxy.keytab

          # A file the ADMIN put into the package's config directory. The package knows
          # nothing about it, so an upgrade has no excuse to touch it.
          printf '# maintained by the admin\n.tracker.example\n.ads.example\n' \
            | sudo tee /etc/linuxmuster-squid/blocked.domains >/dev/null
          sudo chown lmnsquid:lmnsquid /etc/linuxmuster-squid/blocked.domains
          sudo chmod 644 /etc/linuxmuster-squid/blocked.domains

          # One instance. Reconciler.apply() stores the record BEFORE it touches Docker,
          # so a failing image pull still leaves exactly the record the upgrade has to
          # preserve -- the data plane is best effort here, the file state is asserted.
          # --image pins a digest of the admin's own choosing (a documented option) and
          # is what makes the postinst measurable: when only the package version moves,
          # the released default digest and the built default digest are identical and
          # update-all would skip every instance instead of rewriting it.
          sudo "$LMN" create --school all --role teachers --ad-group role-teacher \
            --realm EXAMPLE.ORG --visible-hostname proxy.example.org \
            --keytab-secret proxy.keytab --http-port 3128 --school-subnets 10.0.0.0/8 \
            --image ghcr.io/faircomp/linuxmuster-squid@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            || true
          sudo test -f /var/lib/linuxmuster-squid/instances/all-teachers.yaml

          # A blocklist entry. `lmnsquid blocklist` exists from 7.3.1 on; when the
          # previous release predates it, the same file is written by hand -- either way
          # it is a file the admin owns and the upgrade must leave alone.
          sudo "$LMN" blocklist all-teachers add example.org || true
          BL=/etc/linuxmuster-squid/blocklists/all-teachers
          if ! sudo test -f "$BL/blocked.domains"; then
            sudo install -d -o lmnsquid -g lmnsquid -m 755 /etc/linuxmuster-squid/blocklists
            sudo install -d -o lmnsquid -g lmnsquid -m 755 "$BL"
            printf '.example.org\n' | sudo tee "$BL/blocked.domains" >/dev/null
            sudo chown lmnsquid:lmnsquid "$BL/blocked.domains"
            sudo chmod 644 "$BL/blocked.domains"
          fi
          sudo grep -qx '\.example\.org' "$BL/blocked.domains"

          # Root-owned files in the change log repository, as git writes by root leave them: the
          # 7.3.1-7.3.3 postinst committed as root (its detached maintenance could still write
          # behind the chown), and safe.directory lets an admin run writing git commands as root
          # (gc rewrites packs, refs and reflogs). The upgrade must hand them to lmnsquid before
          # any git runs as lmnsquid, or the change log commits of the upgrade fail.
          GITDIR=/var/lib/linuxmuster-squid/instances
          if sudo test -d "$GITDIR/.git"; then
            sudo git -c safe.directory=$GITDIR -C $GITDIR gc -q
            test -n "$(sudo find $GITDIR ! -user lmnsquid | head -n 1)"
          fi

          # --- snapshot everything that must survive ----------------------------
          mkdir -p before after
          sudo find /etc/linuxmuster-squid -type f \
               \( -name config.yml -o -name proxy.keytab -o -name blocked.domains \) \
               | sort > before/files.txt
          # A manifest that can run empty is a green light that proves nothing:
          # `sha256sum $(cat empty-file)` hashes stdin and `sha256sum -c` then reports
          # "-: OK" with exit 0. Pin the expected count and never pass an empty list.
          test "$(wc -l < before/files.txt)" = 4      # config.yml, keytab, 2x blocked.domains
          xargs -r -a before/files.txt sudo sha256sum > before/sha256
          test "$(wc -l < before/sha256)" = 4
          sudo find /etc/linuxmuster-squid -printf '%m %U:%G %p\n' | sort > before/etc-modes
          sudo stat -c '%a %U:%G' /var/lib/linuxmuster-squid/instances/all-teachers.yaml > before/inst-mode
          sudo cat /var/lib/linuxmuster-squid/instances/all-teachers.yaml > before/all-teachers.yaml
          # The store repository belongs to lmnsquid; safe.directory lets root read it.
          sudo git -c safe.directory=/var/lib/linuxmuster-squid/instances \
                   -C /var/lib/linuxmuster-squid/instances rev-parse HEAD > before/head \
            2>/dev/null || echo none > before/head
          # The instance record is written by the SOFTWARE, so it is compared by the keys
          # the admin set, never by "everything except the field that moves today": the
          # model legitimately gains fields (radius just gained ldap_ca) and a negative
          # list turns this job red in an unrelated PR. Whoever adds an admin-set field
          # adds it here in the same PR -- that coupling is the point.
          # OUTSIDE the checkout on purpose. This job runs actions/checkout, so a helper
          # placed in the workspace puts the repository on sys.path[0] and any import it
          # does could resolve against the SOURCE TREE instead of what apt installed --
          # an assertion that then proves nothing about the installed package. Written to
          # RUNNER_TEMP and run with `-P` (ignore the script's directory), interpreted by
          # the package's own venv so PyYAML needs no extra install.
          cat > "$RUNNER_TEMP/record-keys.py" <<'PY'
          import sys

          import yaml

          ADMIN_KEYS = [
              "access_log_enabled",
              "ad_group",
              "cache_size_mb",
              "http_port",
              "internet_group",
              "keytab_secret",
              "log_retention_days",
              "realm",
              "role",
              "school",
              "school_subnets",
              "visible_hostname",
          ]

          data = yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {}
          missing = [k for k in ADMIN_KEYS if k not in data]
          if missing:
              raise SystemExit(f"instance record lost admin-set key(s): {', '.join(missing)}")
          for key in ADMIN_KEYS:
              print(f"{key}={data[key]!r}")
          PY
          /opt/linuxmuster-squid/venv/bin/python -P "$RUNNER_TEMP/record-keys.py" \
            before/all-teachers.yaml > before/record
          test "$(wc -l < before/record)" = 12
          cat before/files.txt before/sha256 before/etc-modes before/inst-mode before/head before/record

      - name: Upgrade to the freshly built package
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          set -o pipefail
          # --reinstall --allow-downgrades: on main the build is regularly version-equal
          # to the release, and a plain install would say "already the newest version"
          # and test nothing. dpkg must run the postinst with $2 set, or its upgrade
          # branch (try-restart, update-all, reconcile) never runs.
          sudo apt-get install -y --reinstall --allow-downgrades ./packages/*.deb 2>&1 \
            | tee upgrade.log

      - name: Assert that nothing was lost
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          set -o pipefail
          new="$(dpkg-query -W -f='${Version}' linuxmuster-squid)"
          GITDIR=/var/lib/linuxmuster-squid/instances

          # 1. the postinst took its UPGRADE branch (dpkg passed $2), it did not
          #    silently re-run the fresh-install path: dpkg names the version it
          #    unpacked over, and the control plane logged the update-all that only
          #    the `[ -n "${2:-}" ]` branch of the postinst calls.
          grep -E 'Unpacking linuxmuster-squid \([^)]+\) over \([^)]+\)' upgrade.log
          # dpkg logs the action it took. It is "upgrade" whenever the package was
          # already installed -- including a same-version --reinstall (verified) -- and
          # "install" when it was not. Without this the whole job can pass while apt did
          # nothing at all, the defect this template shipped with once.
          grep " upgrade linuxmuster-squid:" /var/log/dpkg.log
          sudo journalctl -u linuxmuster-squid.service --no-pager \
            | grep -F 'lmnsquid.audit:update-all to default image='

          # 2. every admin-owned file byte-identical (config.yml carries the API token)
          test -s before/sha256
          sudo sha256sum -c before/sha256

          # 3. modes and ownership in the config tree unchanged
          sudo find /etc/linuxmuster-squid -printf '%m %U:%G %p\n' | sort > after/etc-modes
          diff -u before/etc-modes after/etc-modes

          # 4. the instance record is written by the software, not the admin, and the
          #    postinst rewrites `image:` on purpose (update-all). Every key the admin
          #    set must be identical -- compared as a POSITIVE list (record-keys.py),
          #    so a field the model gains later does not turn this job red. The rollback
          #    note must exist, which covers both outcomes: pull succeeded (new digest)
          #    or failed (auto-rollback, the record is back on the pinned digest).
          sudo cat "$GITDIR/all-teachers.yaml" > after/all-teachers.yaml
          /opt/linuxmuster-squid/venv/bin/python -P "$RUNNER_TEMP/record-keys.py" \
            after/all-teachers.yaml > after/record
          test "$(wc -l < after/record)" = 12
          diff -u before/record after/record
          # The raw record diff is a log entry, never an assertion.
          diff -u before/all-teachers.yaml after/all-teachers.yaml || true
          sudo test -f "$GITDIR/all-teachers.prev"
          sudo stat -c '%a %U:%G' "$GITDIR/all-teachers.yaml" > after/inst-mode
          diff -u before/inst-mode after/inst-mode

          # 5. the service survived the upgrade
          systemctl is-enabled linuxmuster-squid.service
          systemctl is-active linuxmuster-squid.service

          # 6. the CLI reports the version of the .deb (~rc -> rc in PEP 440)
          test "$(command -v lmnsquid)" = /usr/bin/lmnsquid
          sudo lmnsquid version | grep -F "\"${new//\~/}\""

          # 7. no leftovers of the old version, nothing world-writable (1.3.0 shipped
          #    /opt world-writable; dpkg fixes files but not existing directories, the
          #    postinst's `chmod -R go-w` does)
          comm -13 <(dpkg -L linuxmuster-squid | grep '^/opt/' | sort) \
                   <(sudo find /opt/linuxmuster-squid | sort) > after/orphans
          test ! -s after/orphans || { echo "files under /opt dpkg does not own:"; cat after/orphans; exit 1; }
          # Only files and directories: a symlink is always lrwxrwxrwx on Linux and its
          # mode is meaningless (the venv ships four: python, python3, python3.12, lib64).
          sudo find /opt/linuxmuster-squid /etc/linuxmuster-squid /var/lib/linuxmuster-squid \
               \( -type f -o -type d \) -perm -0002 > after/world-writable
          test ! -s after/world-writable || { echo "world-writable:"; cat after/world-writable; exit 1; }
          test "$(sudo find /opt/linuxmuster-squid -name 'lmnsquid-*.dist-info' | wc -l)" = 1

          # 8. the change log of the instance store recorded the upgrade
          sudo git -c safe.directory=$GITDIR -C $GITDIR rev-parse HEAD > after/head
          test -s after/head
          test "$(cat before/head)" != "$(cat after/head)"
          sudo git -c safe.directory=$GITDIR -C $GITDIR log -1 --format='%an' \
            | grep -qx 'linuxmuster-squid'
          sudo git -c safe.directory=$GITDIR -C $GITDIR log --oneline -5
          # the history of the released version is kept (the upgrade only adds commits), the
          # root-owned files left before the upgrade belong to lmnsquid again, and background
          # maintenance is off in the repository, so no git process outlives a configure
          if [ "$(cat before/head)" != none ]; then
            sudo git -c safe.directory=$GITDIR -C $GITDIR merge-base --is-ancestor "$(cat before/head)" HEAD
          fi
          test -z "$(sudo find /etc/linuxmuster-squid /var/lib/linuxmuster-squid ! -user lmnsquid)"
          test "$(sudo git -c safe.directory=$GITDIR -C $GITDIR config --local maintenance.auto)" = false
          test "$(sudo git -c safe.directory=$GITDIR -C $GITDIR config --local gc.auto)" = 0

          # 9. the package database is consistent and every file matches its md5sum
          test -z "$(dpkg --audit)"
          sudo apt-get -f install -s | grep -q '0 newly installed'
          test -z "$(sudo dpkg --verify linuxmuster-squid)"

          {
            echo "### upgrade smoke: ${{ steps.prev.outputs.tag }} -> $new"
            echo
            echo '```'
            sudo sha256sum -c before/sha256
            echo "modes/ownership under /etc/linuxmuster-squid: unchanged"
            echo "instance record: all 12 admin-set keys identical, all-teachers.prev present"
            echo "change log: history kept, root-owned leftovers handed to lmnsquid, maintenance off"
            echo "dpkg log: $(grep ' upgrade linuxmuster-squid:' /var/log/dpkg.log | tail -1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Journal of the control plane (always, for diagnosis)
        if: always() && steps.prev.outputs.skip != '1'
        run: sudo journalctl -u linuxmuster-squid.service --no-pager | tail -60
