[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmnsquid"
# The version is the top entry of ../debian/changelog (single version source);
# setup.py feeds it to setuptools at build time.
dynamic = ["version"]
description = "Control plane for linuxmuster-squid Docker containers"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Kevin Stenzel", email = "mail@kevin-stenzel.de" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "docker>=7",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "typer",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/faircomp/linuxmuster-squid"
Repository = "https://github.com/faircomp/linuxmuster-squid"
Issues = "https://github.com/faircomp/linuxmuster-squid/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
lmnsquid-api = "lmnsquid.main:main"
lmnsquid = "lmnsquid.cli:main"

[tool.setuptools.packages.find]
include = ["lmnsquid*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the classic default rule set explicitly so an unpinned ruff upgrade cannot
# silently widen the checks (0.16 started flagging UP/B/BLE/… that this project
# never opted into — e.g. B008 is a false positive for Typer's Option() defaults).
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
