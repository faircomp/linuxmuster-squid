# Kerberos E2E stack for linuxmuster-squid (heavy tier / crabbox).
# Proves: teacher->200, student->403, blocked domain->403, no ticket->407, and the
# domains without proxy auth (ADR-016) incl. their negative cases.
# Orchestrated by scripts/tests/e2e_kerberos.sh (brings services up in order,
# creates fixtures and runs the assertions). Realm/domain: EXAMPLE.INTERNAL.
name: lmnsquid-e2e

networks:
  e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  shared: {}          # DC exports the Keytab here, Squid reads it (ro)

services:
  # KDC + AD-LDAP + internal DNS. Creates the domain on first start.
  samba-dc:
    image: nowsci/samba-domain
    hostname: dc
    privileged: true
    environment:
      DOMAIN: "EXAMPLE.INTERNAL"
      DOMAINPASS: "Passw0rd!"
      NOCOMPLEXITY: "true"
      HOSTIP: "172.28.0.2"
      INSECURELDAP: "true"
    networks:
      e2e:
        ipv4_address: 172.28.0.2
    volumes:
      - shared:/shared

  # The image under test.
  squid:
    build: ../../image
    image: linuxmuster-squid:dev
    hostname: squid.example.internal
    depends_on: [samba-dc]
    environment:
      INSTANCE: "e2e-teachers"
      VISIBLE_HOSTNAME: "squid.example.internal"
      REALM: "EXAMPLE.INTERNAL"
      AD_GROUP: "teachers"
      SCHOOL_SUBNETS: "0.0.0.0/0"      # Subnet scope is tested in P3
      KEYTAB: "/shared/squid.keytab"
      CACHE_SIZE_MB: "200"
    dns: ["172.28.0.2"]               # AD-DNS: resolves SRV/_ldap._tcp + origin A-record
    networks:
      e2e:
        ipv4_address: 172.28.0.10
    volumes:
      - shared:/shared:ro
      - ./blocked.domains:/etc/squid/lists/blocked.domains:ro
    read_only: true
    tmpfs: ["/run", "/tmp", "/var/log/squid", "/var/spool/squid"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "DAC_OVERRIDE", "CHOWN"]
    security_opt: ["no-new-privileges:true"]

  # 2nd school (Multischool): the SAME image, different group/FQDN — proves isolation
  # + prefix rule (default-school unprefixed, other schools "<schule>-...").
  squid2:
    image: linuxmuster-squid:dev
    hostname: squid2.example.internal
    depends_on: [samba-dc, squid]
    environment:
      INSTANCE: "e2e-schule2-teachers"
      VISIBLE_HOSTNAME: "squid2.example.internal"
      REALM: "EXAMPLE.INTERNAL"
      AD_GROUP: "schule2-teachers"
      SCHOOL_SUBNETS: "0.0.0.0/0"
      KEYTAB: "/shared/squid.keytab"
      CACHE_SIZE_MB: "200"
    dns: ["172.28.0.2"]
    networks:
      e2e:
        ipv4_address: 172.28.0.11
    volumes:
      - shared:/shared:ro
      # The list directory of a control plane without ADR-016 (no noauth.domains).
      - ./lists-legacy:/etc/squid/lists:ro
    read_only: true
    tmpfs: ["/run", "/tmp", "/var/log/squid", "/var/spool/squid"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "DAC_OVERRIDE", "CHOWN"]
    security_opt: ["no-new-privileges:true"]

  # Internet gate: teachers AND (internet OR schule2-internet) -> proves the linuxmuster
  # "Internetsperre" multi-group OR gate (a user passes if in ANY listed internet group,
  # so it covers visitors) and fail-closed when in none.
  squid-inet:
    image: linuxmuster-squid:dev
    hostname: squid3.example.internal
    depends_on: [samba-dc, squid]
    environment:
      INSTANCE: "e2e-inet"
      VISIBLE_HOSTNAME: "squid3.example.internal"
      REALM: "EXAMPLE.INTERNAL"
      AD_GROUP: "teachers"
      INTERNET_GROUP: "internet:schule2-internet"
      SCHOOL_SUBNETS: "0.0.0.0/0"
      KEYTAB: "/shared/squid.keytab"
      CACHE_SIZE_MB: "200"
    dns: ["172.28.0.2"]
    networks:
      e2e:
        ipv4_address: 172.28.0.12
    volumes:
      - shared:/shared:ro
      - ./blocked.domains:/etc/squid/lists/blocked.domains:ro
    read_only: true
    tmpfs: ["/run", "/tmp", "/var/log/squid", "/var/spool/squid"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "DAC_OVERRIDE", "CHOWN"]
    security_opt: ["no-new-privileges:true"]

  # Domains without proxy auth (ADR-016): the list directory mounted like the control plane
  # does it; school_net is the test client alone, so a request from any other container is
  # "outside the school subnets".
  squid-noauth:
    image: linuxmuster-squid:dev
    hostname: squid4.example.internal
    depends_on: [samba-dc, squid]
    environment:
      INSTANCE: "e2e-noauth"
      VISIBLE_HOSTNAME: "squid4.example.internal"
      REALM: "EXAMPLE.INTERNAL"
      AD_GROUP: "teachers"
      SCHOOL_SUBNETS: "172.28.0.30/32"
      KEYTAB: "/shared/squid.keytab"
      CACHE_SIZE_MB: "200"
    dns: ["172.28.0.2"]
    # squid loads /etc/hosts into its reverse cache too: the IP-literal test needs the
    # address to map back to a listed name (proves dstdomain -n).
    extra_hosts: ["secure.example.internal:172.28.0.21"]
    networks:
      e2e:
        ipv4_address: 172.28.0.13
    volumes:
      - shared:/shared:ro
      - ./lists-noauth:/etc/squid/lists:ro
    read_only: true
    tmpfs: ["/run", "/tmp", "/var/log/squid", "/var/spool/squid"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "DAC_OVERRIDE", "CHOWN"]
    security_opt: ["no-new-privileges:true"]

  # An image from before ADR-016 (the one 7.3.7 pins; set by e2e_kerberos.sh) with a list
  # directory that holds noauth.domains: what an instance runs until the upgrade replaces its
  # container. It must ignore the list and keep asking for a ticket.
  squid-old:
    # (default only for the other smokes that start the DC from this file)
    image: ${LMNSQUID_OLD_IMAGE:-linuxmuster-squid:dev}
    hostname: squid5.example.internal
    depends_on: [samba-dc, squid]
    environment:
      INSTANCE: "e2e-old"
      VISIBLE_HOSTNAME: "squid5.example.internal"
      REALM: "EXAMPLE.INTERNAL"
      AD_GROUP: "teachers"
      SCHOOL_SUBNETS: "0.0.0.0/0"
      KEYTAB: "/shared/squid.keytab"
      CACHE_SIZE_MB: "200"
    dns: ["172.28.0.2"]
    networks:
      e2e:
        ipv4_address: 172.28.0.14
    volumes:
      - shared:/shared:ro
      - ./lists-old:/etc/squid/lists:ro
    read_only: true
    tmpfs: ["/run", "/tmp", "/var/log/squid", "/var/spool/squid"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "DAC_OVERRIDE", "CHOWN"]
    security_opt: ["no-new-privileges:true"]

  # Allowed target (returns 200).
  origin:
    image: nginx:alpine
    hostname: origin.example.internal
    networks:
      e2e:
        ipv4_address: 172.28.0.20

  # Allowed HTTPS target (self-signed) — for the splice test.
  origin-https:
    build: ./origin-https
    hostname: secure.example.internal
    networks:
      e2e:
        ipv4_address: 172.28.0.21

  # Kerberos client that runs the four assertions (ENTRYPOINT = /assert.sh).
  test-client:
    build: ./client
    depends_on: [squid]
    dns: ["172.28.0.2"]
    networks:
      e2e:
        ipv4_address: 172.28.0.30
